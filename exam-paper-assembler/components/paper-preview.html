<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>试卷预览组件</title>
<style>
  :root{
    --ink:#1f2937; --paper:#ffffff; --accent:#2563eb; --line:#d1d5db;
    --muted:#6b7280; --tag:#eff6ff; --warn:#b45309;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif; background:#f3f4f6; color:var(--ink);}
  .topbar{position:sticky; top:0; z-index:10; display:flex; flex-wrap:wrap; gap:8px 12px;
    align-items:center; padding:10px 16px; background:#fff; border-bottom:1px solid var(--line);}
  .topbar h1{font-size:16px; margin-right:auto;}
  .topbar button, .topbar label.btn{font-size:13px; padding:6px 12px; border:1px solid var(--line);
    border-radius:6px; background:#fff; cursor:pointer; color:var(--ink);}
  .topbar button:hover{border-color:var(--accent); color:var(--accent);}
  .topbar input[type=file]{display:none;}
  #toggleAns.on{background:var(--accent); color:#fff; border-color:var(--accent);}
  .wrap{max-width:860px; margin:20px auto 60px; padding:0 12px;}
  .paper{background:var(--paper); padding:40px 48px 48px; border:1px solid var(--line); border-radius:4px; box-shadow:0 1px 3px rgba(0,0,0,.06);}
  .paper h2{font-size:22px; text-align:center; margin-bottom:6px;}
  .paper .sub{text-align:center; color:var(--muted); font-size:13px; margin-bottom:18px;}
  .fillbar{display:flex; gap:24px; flex-wrap:wrap; font-size:13px; color:var(--muted);
    border-bottom:1px dashed var(--line); padding-bottom:12px; margin-bottom:18px;}
  .section{margin-top:22px;}
  .section h3{font-size:16px; font-weight:600; border-left:4px solid var(--accent);
    padding-left:10px; margin-bottom:12px;}
  .q{margin-bottom:14px; padding:10px 12px; border:1px solid transparent; border-radius:6px;}
  .q:hover{background:#fafafa;}
  .q .stem{font-size:14px; line-height:1.7;}
  .q .meta{color:var(--muted); font-size:12px; margin-left:8px;}
  .opts{margin-top:8px; margin-left:6px; font-size:14px; line-height:1.8;}
  .opts div{padding:2px 0;}
  .ans{display:none; margin-top:8px; padding:6px 10px; background:var(--tag); border-radius:6px;
    font-size:13px; color:#1e3a8a;}
  .ans.show{display:block;}
  .report{margin-top:28px; padding:14px; background:#f8fafc; border:1px dashed var(--line);
    border-radius:6px; font-size:13px; color:var(--muted); line-height:1.8;}
  .report b{color:var(--ink);}
  .rep-gap{color:var(--warn);}
  .no-json{padding:48px 8px; text-align:center; color:var(--muted);}
  .drop{padding:60px 8px; text-align:center; border:2px dashed var(--line); border-radius:8px; color:var(--muted);}
  /* 移动端适配 */
  @media (max-width:640px){
    .wrap{margin-top:12px;}
    .paper{padding:16px 14px 24px; border:0; box-shadow:none; }
    .q .stem, .opts{font-size:15px;}
    .topbar{font-size:12px;}
  }
  /* 打印 */
  @media print{
    body{background:#fff;}
    .topbar{display:none;}
    .wrap{max-width:100%; margin:0; padding:0;}
    .paper{border:none; box-shadow:none; padding:0;}
    .q:hover{border:none;}
    .report{display:block; page-break-inside:avoid;}
  }
</style>
</head>
<body>
<div class="topbar">
  <h1>试卷预览</h1>
  <label for="file">选择 JSON</label>
  <input type="file" id="file" accept=".json,application/json">
  <button id="sample">加载示例</button>
  <button id="toggle">显示答案</button>
  <button id="copy">复制 JSON 到剪贴板</button>
  <button onclick="window.print()">打印 / 存为 PDF</button>
</div>
<div class="wrap" id="wrap"></div>

  var elWrap = document.getElementById("wrap");

  function node(tag, cls, text){
    var n = document.createElement(tag);
    if (cls) n.className = cls;
    if (text !== undefined) n.textContent = text; // 安全：只用 textContent，防 XSS
    return n;
  }

  function cn(i){
    return "一二三四五六七八九十".charAt(i - 1) || (i);
  }

  function render(data){
    var paper = data && data.paper;
    var report = data && data.report;
    if (!paper || !paper.sections){ showNoJson(); return; }
    var root = document.createElement("div");
    var sheet = node("div", "paper");

    sheet.appendChild(node("h2", null, paper.title || paper.exam || "试卷"));
    var sub = node("div", "sub",
      (paper.course || "") + "　|　满分 " + paper.total_marks_nominal + " 分　|　种子 " + paper.seed);
    sheet.appendChild(sub);

    var bar = node("div", "fillbar");
    bar.appendChild(node("span", null, "姓名：__________　班级：__________　学号：__________"));
    sheet.appendChild(bar);

    paper.sections.forEach(function(sec, i){
      var secEl = node("div", "section");
      var head = node("h3", null, "第" + cn(i + 1) + "部分　" + sec.type +
        "（每题 " + sec.marks + " 分，共 " + sec.count_target + " 题，小计 " + sec.marks_picked + " 分）");
      secEl.appendChild(head);
      sec.questions.forEach(function(q, j){
        var qEl = node("div", "q");
        var stem = node("div", "stim");
        stem.appendChild(document.createTextNode((j + 1) + ". " + q.stem));
        stem.appendChild(node("span", "meta", "　[" + q.kp + " · " + q.difficulty + " · " + q.marks + "分]"));
        qEl.appendChild(stem);
        if (q.options && q.options.length){
          var opts = node("div", "opts");
          q.options.forEach(function(o, k){
            var tag = String.fromCharCode(65 + k);
            opts.appendChild(node("div", null, tag + ". " + o));
          });
          qEl.appendChild(opts);
        }
        if (showAnswers && q.answer !== ""){
          var ans = node("div", "ans show");
          ans.appendChild(document.createTextNode("【答案】" + q.answer +
            (q.explanation ? "　【解析】" + q.explanation : "")));
          qEl.appendChild(ans);
        }
        secEl.appendChild(qEl);
      });
      sheet.appendChild(secEl);
    });

    if (report){
      var rep = node("div", "report");
      rep.appendChild(node("b", null, "组卷报告："));
      rep.appendChild(document.createTextNode("实际总分 " + paper.marks_picked + " / 计划 " +
        paper.total_marks_nominal + "　" + (report.marks_ok ? "✓ 对齐" : "✗ 未对齐")));
      rep.appendChild(document.createElement("br"));
      if (report.gaps && report.gaps.length){
        var g = node("span", "rep-gap", "缺口：");
        report.gaps.forEach(function(x){
          g.appendChild(document.createTextNode(x.type + "/" + x.kp + " 需 " + x.goal + " 缺 " + x.got + "；"));
        });
        rep.appendChild(g);
      } else {
        rep.appendChild(document.createTextNode("✓ 无缺口"));
      }
      if (report.warnings && report.warnings.length){
        rep.appendChild(document.createElement("br"));
        report.warnings.forEach(function(w){
          rep.appendChild(node("span", "rep-gap", "⚠ " + w + "; "));
        });
      }
      sheet.appendChild(rep);
    }
    root.appendChild(sheet);
    wrap.innerHTML = "";
    wrap.appendChild(root);
  }

  function showNoJson(){
    wrap.innerHTML = "";
    var d = node("div", "drop");
    d.appendChild(node("p", "no-json", "请选择组卷输出的 JSON 文件，或点击「加载示例」查看效果。"));
    d.appendChild(node("p", "no-json", "JSON 结构：{paper:{title,course,total_marks_nominal,seed,sections:[{type,count_target,marks,questions:[{stem,options,answer,explanation,kp,difficulty}]}]}, report:{...}}"));
    wrap.appendChild(d);
  }

  document.getElementById("sample").addEventListener("click", function(){ render(SAMPLE); });
  document.getElementById("copy").addEventListener("click", function(){
    var txt = JSON.stringify(SAMPLE, null, 2);
    if (navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){
      alert("示例 JSON 已复制到剪贴板");
    }, function(){ prompt("手动复制：", txt); });
    else prompt("手动复制：", txt);
  });
  document.getElementById("file").addEventListener("change", function(e){
    var f = e.target.files && e.target.files[0];
    if (!f) return;
    var reader = new FileReader();
    reader.onload = function(){
      try { render(JSON.parse(reader.result)); }
      catch(err){ alert("JSON 解析失败：" + err.message); }
    };
    reader.readAsText(f, "utf-8");
  });
  document.getElementById("toggle").addEventListener("click", function(){
    showAnswers = !showAnswers;
    this.classList.toggle("on", showAnswers);
    this.textContent = showAnswers ? "隐藏答案" : "显示答案";
    // 已渲染内容需重渲染以刷新答案解析
    var wrapChild = wrap.querySelector(".paper");
    if (wrapChild) { /* 保存 paper 数据并重渲染 */
      var paperData = window.__lastData;
      if (paperData) render(paperData);
    }
  });

  // 记录最后渲染的数据，便于切换答案后重渲染
  var _render = render;
  render = function(data){ window.__lastData = data; _render(data); };

  render(SAMPLE); // 初始展示示例
})();
</script>
</body>
</html>
